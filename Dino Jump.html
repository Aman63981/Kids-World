<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Runner: Dino Jump - KidsWorld</title>

    <!-- Favicon: Laughing Kid Face -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23FACC15' stroke='%231E293B' stroke-width='2'/%3E%3Cpath d='M19 26c.5-4 6.5-4 7 0M38 26c.5-4 6.5-4 7 0' stroke='%231E293B' stroke-width='3.5' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='16' cy='33' r='4.5' fill='%23FB7185'/%3E%3Ccircle cx='48' cy='33' r='4.5' fill='%23FB7185'/%3E%3Cpath d='M22 34c0 0 1 12 10 12s10-12 10-12Z' fill='%23881337' stroke='%231E293B' stroke-width='2'/%3E%3Cellipse cx='32' cy='44' rx='6' ry='3.5' fill='%23F43F5E'/%3E%3C/svg%3E">

    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Fredoka Kids Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(180deg, #fdba74 0%, #fed7aa 40%, #fef08a 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        .game-wrapper {
            width: 95%;
            max-width: 920px;
            background: #ffffff;
            border-radius: 36px;
            padding: 22px;
            box-shadow: 0 22px 45px rgba(0,0,0,0.14);
            border: 6px solid #f97316;
            position: relative;
        }

        .status-pill {
            border-radius: 50px;
            padding: 8px 18px;
            font-weight: 700;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* Canvas Arena */
        .runner-canvas-container {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 28px;
            overflow: hidden;
            border: 4px solid #ea580c;
            background: #7dd3fc;
            margin-top: 14px;
            transition: transform 0.1s ease;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Question Banner overlay */
        .math-banner {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            border: 4px solid #f97316;
            border-radius: 24px;
            padding: 8px 28px;
            box-shadow: 0 8px 0 rgba(234, 88, 12, 0.25);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .math-banner h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
            letter-spacing: 1px;
        }

        /* Big Chunky Answer Buttons */
        .answer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 18px;
        }

        .ans-btn {
            font-size: 2.4rem;
            font-weight: 700;
            padding: 12px 10px;
            border-radius: 24px;
            border: none;
            color: #ffffff;
            box-shadow: 0 8px 0 rgba(0,0,0,0.18);
            cursor: pointer;
            transition: all 0.12s ease-in-out;
            line-height: 1;
        }
        .ans-btn:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.18);
        }

        .btn-opt-0 { background: #3b82f6; border-bottom: 6px solid #1d4ed8; }
        .btn-opt-1 { background: #10b981; border-bottom: 6px solid #047857; }
        .btn-opt-2 { background: #f59e0b; border-bottom: 6px solid #b45309; }

        /* Wrong Click Disabled State */
        .ans-btn.btn-wrong {
            background: #ef4444 !important;
            border-bottom: 6px solid #b91c1c !important;
            opacity: 0.55;
            cursor: not-allowed;
            transform: scale(0.95);
        }

        /* Kid Controls */
        .kid-btn {
            border-radius: 22px;
            border-bottom: 5px solid rgba(0,0,0,0.18) !important;
            font-weight: 700;
            transition: all 0.15s ease-in-out;
        }
        .kid-btn:active {
            transform: translateY(3px);
            border-bottom: 2px solid rgba(0,0,0,0.18) !important;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- Top Bar Controls -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <a href="../Home page.html" class="btn btn-outline-secondary kid-btn py-2 px-3">
            <i class="bi bi-arrow-left me-1"></i> Dashboard
        </a>
        
        <button class="btn btn-warning kid-btn px-3 py-2" id="langBtn" onclick="toggleLanguage()">
            🌐 Switch to English
        </button>

        <div class="d-flex gap-2">
            <span class="badge bg-danger status-pill" id="livesBadge">
                ❤️ 3
            </span>
            <span class="badge bg-warning text-dark status-pill" id="scoreBadge">
                ⭐ 0
            </span>
        </div>
    </div>

    <!-- 1. Active Play Arena -->
    <div id="playArea">
        <div class="runner-canvas-container" id="canvasContainer">
            <div class="math-banner" id="mathBanner">
                <span class="fs-4 text-warning">⚡</span>
                <h2 id="questionText">5 + 6 = ?</h2>
                <span class="fs-4 text-warning">⚡</span>
            </div>
            
            <canvas id="gameCanvas" width="860" height="380"></canvas>
        </div>

        <!-- 3 Quick Choice Buttons -->
        <div class="answer-grid" id="optionsContainer">
            <button class="ans-btn btn-opt-0" onclick="checkAnswer(0)" id="opt0">11</button>
            <button class="ans-btn btn-opt-1" onclick="checkAnswer(1)" id="opt1">14</button>
            <button class="ans-btn btn-opt-2" onclick="checkAnswer(2)" id="opt2">10</button>
        </div>
    </div>

    <!-- 2. Game Over / Retry Screen (Hearts = 0) -->
    <div id="retryArea" class="d-none text-center py-4">
        <div style="font-size: 5rem;">💔</div>
        <h1 class="display-5 fw-bolder text-danger mb-2" id="retryTitle">ओह! डाइनो थक गया!</h1>
        <p class="fs-4 text-secondary mb-3" id="retrySubtitle">कोई बात नहीं, अभ्यास से ही हम सब सीखते हैं!</p>

        <div class="card p-3 my-3 mx-auto shadow-sm rounded-4 border-0 text-center" style="max-width: 360px; background: #fee2e2; border: 3px dashed #ef4444 !important;">
            <span class="text-muted fw-bold">STARS EARNED</span>
            <h1 class="display-4 fw-bold text-danger my-1" id="retryStarsDisplay">⭐ 0</h1>
            <p class="text-muted mb-0">हार मत मानो, फिर से दौड़ लगाओ!</p>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
            <button class="btn btn-success kid-btn px-4 py-3 fs-5" onclick="restartGame()">
                <i class="bi bi-arrow-repeat me-1"></i> <span id="retryBtnText">दोबारा कोशिश करें</span>
            </button>
            <a href="../Home page.html" class="btn btn-primary kid-btn text-white px-4 py-3 fs-5 text-decoration-none">
                <i class="bi bi-house-door me-1"></i> डैशबोर्ड
            </a>
        </div>
    </div>

    <!-- 3. Victory Screen -->
    <div id="victoryArea" class="d-none text-center py-4">
        <div style="font-size: 5rem;">🏆</div>
        <h1 class="display-5 fw-bolder text-warning mb-2" id="winTitle">डाइनो चैंपियन!</h1>
        <p class="fs-4 text-secondary mb-3" id="winSubtitle">आपने सभी बाधाएं पार करके जंगल की रेस पूरी कर ली!</p>

        <div class="card p-3 my-3 mx-auto shadow-sm rounded-4 border-0 text-center" style="max-width: 360px; background: #fef08a; border: 3px dashed #f59e0b !important;">
            <span class="text-muted fw-bold">TOTAL STARS</span>
            <h1 class="display-4 fw-bold text-dark my-1" id="finalStarsDisplay">⭐ 500</h1>
            <div class="fs-3 text-warning">⭐⭐⭐⭐⭐</div>
            <span class="badge bg-success rounded-pill px-3 py-2 mt-2 fs-6">बैज: मैथ रनर स्पीडस्टार ⚡</span>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
            <button class="btn btn-warning kid-btn px-4 py-3 fs-5" onclick="restartGame()">
                <i class="bi bi-arrow-clockwise me-1"></i> फिर से खेलें
            </button>
            <a href="../Home page.html" class="btn btn-primary kid-btn text-white px-4 py-3 fs-5 text-decoration-none">
                <i class="bi bi-house-door me-1"></i> डैशबोर्ड
            </a>
        </div>
    </div>
</div>

<script>
    // --- 1. Sound Synthesis Engine ---
    let audioCtx = null;
    function getAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playJumpSound() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.22);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
    }

    function playCorrectChime() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        [587.33, 880, 1174.66].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + i * 0.08);
            gain.gain.setValueAtTime(0.3, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.25);
        });
    }

    function playHitThudSound() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.linearRampToValueAtTime(60, now + 0.28);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
    }

    function playGameOverSound() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        [320, 280, 240, 180].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.16);
            gain.gain.setValueAtTime(0.35, now + idx * 0.16);
            gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.16 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.16);
            osc.stop(now + idx * 0.16 + 0.3);
        });
    }

    function playFanfareSound() {
        const ctx = getAudioContext();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
            gain.gain.setValueAtTime(0.3, ctx.currentTime + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.12);
            osc.stop(ctx.currentTime + idx * 0.12 + 0.35);
        });
    }

    // --- 2. Voice Guidance Engine ---
    let currentLang = 'hi';
    let availableVoices = [];

    function loadVoices() {
        if ('speechSynthesis' in window) {
            availableVoices = window.speechSynthesis.getVoices();
        }
    }
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 0.92;
        utter.pitch = 1.3;

        if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

        if (currentLang === 'hi') {
            utter.lang = 'hi-IN';
            const v = availableVoices.find(item => item.lang.includes('hi'));
            if (v) utter.voice = v;
        } else {
            utter.lang = 'en-US';
            const v = availableVoices.find(item => item.lang.includes('en') && (item.name.includes('Samantha') || item.name.includes('Zira') || item.name.includes('Female')));
            if (v) utter.voice = v;
        }
        window.speechSynthesis.speak(utter);
    }

    // --- 3. Runner & Collision Engine ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GROUND_Y = 300;
    let score = 0;
    let lives = 3;
    const targetQuests = 5;
    let solvedQuests = 0;
    let isJumping = false;
    let isHitStumbling = false;
    let runFrame = 0;

    let isGameOver = false;
    let animationFrameId = null;

    const SPEED = 1.3; 
    let groundOffset = 0;
    let cloudOffset = 0;

    const dino = {
        x: 110,
        y: GROUND_Y - 70,
        width: 60,
        height: 70,
        vy: 0,
        gravity: 0.75,
        jumpPower: -17
    };

    let obstacle = {
        x: 880,
        y: GROUND_Y - 45,
        width: 44,
        height: 44,
        hasCollided: false
    };

    let currentQuestion = {
        text: "5 + 6",
        answer: 11,
        options: [11, 14, 10]
    };

    function resetOptionButtons() {
        for (let i = 0; i < 3; i++) {
            const btn = document.getElementById(`opt${i}`);
            btn.disabled = false;
            btn.classList.remove('btn-wrong');
        }
    }

    function generateQuestion() {
        if (isGameOver) return;

        resetOptionButtons();
        obstacle.x = canvas.width + 120;
        obstacle.hasCollided = false;

        const isAddition = Math.random() > 0.35;
        let a, b, ans;

        if (isAddition) {
            a = Math.floor(Math.random() * 8) + 2;
            b = Math.floor(Math.random() * 8) + 2;
            ans = a + b;
            currentQuestion.text = `${a} + ${b}`;
        } else {
            a = Math.floor(Math.random() * 8) + 6;
            b = Math.floor(Math.random() * 5) + 1;
            ans = a - b;
            currentQuestion.text = `${a} - ${b}`;
        }

        currentQuestion.answer = ans;

        const decoys = new Set();
        while (decoys.size < 2) {
            let offset = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 3) + 1);
            let val = ans + offset;
            if (val > 0 && val !== ans) decoys.add(val);
        }

        const opts = [ans, ...Array.from(decoys)].sort(() => 0.5 - Math.random());
        currentQuestion.options = opts;

        document.getElementById('questionText').textContent = `${currentQuestion.text} = ?`;
        document.getElementById('opt0').textContent = opts[0];
        document.getElementById('opt1').textContent = opts[1];
        document.getElementById('opt2').textContent = opts[2];

        const speechQ = (currentLang === 'hi') 
            ? `${currentQuestion.text} कितना होगा?`
            : `What is ${currentQuestion.text}?`;
        speakText(speechQ);
    }

    function checkAnswer(optionIndex) {
        if (isGameOver) return;
        getAudioContext();
        
        const chosenBtn = document.getElementById(`opt${optionIndex}`);
        const chosen = currentQuestion.options[optionIndex];

        if (chosen === currentQuestion.answer) {
            // Sahi Answer: Dino hurdles high, earns stars, progresses to next question
            playJumpSound();
            playCorrectChime();
            dinoJump();
            score += 100;
            solvedQuests++;
            document.getElementById('scoreBadge').textContent = `⭐ ${score}`;

            if (solvedQuests >= targetQuests) {
                isGameOver = true;
                setTimeout(() => showVictory(), 700);
            } else {
                const cheer = (currentLang === 'hi') ? "शानदार जंप! सही जवाब!" : "Great jump! Correct!";
                speakText(cheer);
                setTimeout(generateQuestion, 1400);
            }
        } else {
            // Galat Answer: Disable only this button; Question remains the same!
            chosenBtn.disabled = true;
            chosenBtn.classList.add('btn-wrong');
            
            playHitThudSound();
            triggerHitReaction();
            lives = Math.max(0, lives - 1);
            document.getElementById('livesBadge').textContent = `❤️ ${lives}`;

            if (lives <= 0) {
                // Hearts finished -> Trigger Retry Modal
                showRetryScreen();
            } else {
                const oops = (currentLang === 'hi') ? "ओह! यह गलत है, दूसरा ऑप्शन चुनो!" : "Oops! Try another option!";
                speakText(oops);
            }
        }
    }

    function dinoJump() {
        if (!isJumping) {
            isJumping = true;
            dino.vy = dino.jumpPower;
        }
    }

    function triggerHitReaction() {
        isHitStumbling = true;
        const container = document.getElementById('canvasContainer');
        container.style.transform = "translateX(-8px)";
        setTimeout(() => { container.style.transform = "translateX(8px)"; }, 80);
        setTimeout(() => { container.style.transform = "translateX(-4px)"; }, 160);
        setTimeout(() => { container.style.transform = "translateX(0px)"; }, 240);
        setTimeout(() => { isHitStumbling = false; }, 600);
    }

    // --- 4. Main Game Loop & Collision Detection ---
    function update() {
        if (isGameOver) return;

        groundOffset = (groundOffset + SPEED) % 60;
        cloudOffset = (cloudOffset + 0.3) % 900;

        obstacle.x -= SPEED;

        const dinoHitbox = {
            x: dino.x + 12,
            y: dino.y + 15,
            width: dino.width - 15,
            height: dino.height - 15
        };

        const rockHitbox = {
            x: obstacle.x + 6,
            y: obstacle.y + 6,
            width: obstacle.width - 12,
            height: obstacle.height - 12
        };

        const isColliding = (
            dinoHitbox.x < rockHitbox.x + rockHitbox.width &&
            dinoHitbox.x + dinoHitbox.width > rockHitbox.x &&
            dinoHitbox.y < rockHitbox.y + rockHitbox.height &&
            dinoHitbox.y + dinoHitbox.height > rockHitbox.y
        );

        if (isColliding && !obstacle.hasCollided && !isJumping) {
            obstacle.hasCollided = true;
            playHitThudSound();
            triggerHitReaction();
            lives = Math.max(0, lives - 1);
            document.getElementById('livesBadge').textContent = `❤️ ${lives}`;

            if (lives <= 0) {
                showRetryScreen();
            } else {
                const oopsHit = (currentLang === 'hi') ? "आउच! पत्थर से टक्कर हो गई! जल्दी उत्तर चुनो!" : "Ouch! Hit the rock! Pick an answer!";
                speakText(oopsHit);
            }
        }

        // Loop obstacle back if passed without jumping
        if (obstacle.x < -60) {
            obstacle.x = canvas.width + 120;
            obstacle.hasCollided = false;
        }

        if (isJumping) {
            dino.y += dino.vy;
            dino.vy += dino.gravity;

            if (dino.y >= GROUND_Y - dino.height) {
                dino.y = GROUND_Y - dino.height;
                isJumping = false;
                dino.vy = 0;
            }
        }

        runFrame++;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Sky & Sun
        ctx.fillStyle = "#7dd3fc";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fde047";
        ctx.beginPath();
        ctx.arc(80, 60, 36, 0, Math.PI * 2);
        ctx.fill();

        // Clouds
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        drawCloud(300 - cloudOffset, 60, 45);
        drawCloud(700 - cloudOffset, 90, 55);
        drawCloud(1100 - cloudOffset, 70, 50);

        // Ground
        ctx.fillStyle = "#22c55e";
        ctx.fillRect(0, GROUND_Y, canvas.width, 20);

        ctx.fillStyle = "#854d0e";
        ctx.fillRect(0, GROUND_Y + 20, canvas.width, canvas.height - GROUND_Y - 20);

        ctx.fillStyle = "#713f12";
        for (let x = -groundOffset; x < canvas.width; x += 50) {
            ctx.beginPath();
            ctx.arc(x, GROUND_Y + 45, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        // Obstacle (Rolling Rock)
        ctx.save();
        ctx.translate(obstacle.x + 22, obstacle.y + 22);
        ctx.rotate(-(runFrame * 0.03));
        ctx.fillStyle = "#64748b";
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#475569";
        ctx.beginPath();
        ctx.arc(-8, -8, 8, 0, Math.PI * 2);
        ctx.arc(6, 6, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Dinosaur
        drawDino(dino.x, dino.y, isJumping, isHitStumbling, runFrame);

        if (isHitStumbling) {
            ctx.fillStyle = "rgba(239, 68, 68, 0.6)";
            ctx.beginPath();
            ctx.arc(dino.x + 20, GROUND_Y - 10, 14, 0, Math.PI * 2);
            ctx.arc(dino.x - 10, GROUND_Y - 18, 10, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawCloud(cx, cy, r) {
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.7, 0, Math.PI * 2);
        ctx.arc(cx + r * 0.6, cy - r * 0.2, r * 0.8, 0, Math.PI * 2);
        ctx.arc(cx + r * 1.3, cy, r * 0.7, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawDino(x, y, jumping, hit, frame) {
        ctx.save();
        ctx.translate(x, y);

        if (hit) ctx.rotate(-0.25);

        ctx.fillStyle = hit ? "#eab308" : "#16a34a";
        ctx.beginPath();
        ctx.ellipse(32, 42, 24, 20, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#86efac";
        ctx.beginPath();
        ctx.ellipse(38, 44, 15, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = hit ? "#eab308" : "#16a34a";
        ctx.beginPath();
        ctx.roundRect(36, 6, 32, 28, 12);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(54, 16, 6, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = "#1e293b";
        if (hit) {
            ctx.fillRect(52, 14, 6, 2);
            ctx.fillRect(54, 12, 2, 6);
        } else {
            ctx.beginPath();
            ctx.arc(56, 16, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.strokeStyle = "#14532d";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        if (hit) {
            ctx.arc(58, 26, 4, 0, Math.PI * 2);
        } else {
            ctx.arc(58, 24, 5, 0, Math.PI * 0.8);
        }
        ctx.stroke();

        ctx.fillStyle = hit ? "#eab308" : "#16a34a";
        ctx.beginPath();
        ctx.moveTo(12, 38);
        ctx.lineTo(-12, 30);
        ctx.lineTo(12, 50);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#15803d";
        if (jumping) {
            ctx.fillRect(24, 56, 7, 10);
            ctx.fillRect(36, 56, 7, 10);
        } else if (hit) {
            ctx.fillRect(36, 56, 8, 14);
            ctx.fillRect(48, 56, 8, 14);
        } else {
            const legShift = isGameOver ? 0 : Math.sin(frame * 0.15) * 8;
            ctx.fillRect(22 + legShift, 58, 7, 12);
            ctx.fillRect(38 - legShift, 58, 7, 12);
        }

        ctx.restore();
    }

    function gameLoop() {
        if (!isGameOver) {
            update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }
    }

    // --- 5. Screen Handlers & Translation ---
    function showRetryScreen() {
        isGameOver = true;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);

        playGameOverSound();

        document.getElementById('playArea').classList.add('d-none');
        document.getElementById('retryArea').classList.remove('d-none');
        document.getElementById('retryStarsDisplay').textContent = `⭐ ${score}`;

        if (currentLang === 'hi') {
            document.getElementById('retryTitle').textContent = "ओह! डाइनो थक गया!";
            document.getElementById('retrySubtitle').textContent = "कोई बात नहीं, अभ्यास से ही हम सब सीखते हैं!";
            document.getElementById('retryBtnText').textContent = "दोबारा कोशिश करें";
        } else {
            document.getElementById('retryTitle').textContent = "Oh No! Dino Tripped!";
            document.getElementById('retrySubtitle').textContent = "Practice makes perfect! Give it another go!";
            document.getElementById('retryBtnText').textContent = "Try Again";
        }

        const msg = (currentLang === 'hi') 
            ? "डाइनो थक गया! दोबारा कोशिश करो, तुम कर सकते हो!" 
            : "Dino needs a rest! Try again, you can do it!";
        speakText(msg);
    }

    function showVictory() {
        isGameOver = true;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);

        document.getElementById('playArea').classList.add('d-none');
        document.getElementById('victoryArea').classList.remove('d-none');
        document.getElementById('finalStarsDisplay').textContent = `⭐ ${score}`;

        if (currentLang === 'hi') {
            document.getElementById('winTitle').textContent = "डाइनो चैंपियन!";
            document.getElementById('winSubtitle').textContent = "आपने सभी बाधाएं पार करके जंगल की रेस पूरी कर ली!";
        } else {
            document.getElementById('winTitle').textContent = "Dino Math Champion!";
            document.getElementById('winSubtitle').textContent = "You leaped across all hurdles and conquered the math run!";
        }

        playFanfareSound();
        confetti({ particleCount: 160, spread: 90, origin: { y: 0.55 } });

        setTimeout(() => {
            const cheer = (currentLang === 'hi') 
                ? "हुर्रे! आपने मैथ रनर रेस जीत ली!" 
                : "Hooray! You conquered the Math Dino Run!";
            speakText(cheer);
        }, 500);
    }

    function restartGame() {
        isGameOver = false;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);

        score = 0;
        lives = 3;
        solvedQuests = 0;
        dino.y = GROUND_Y - dino.height;
        isJumping = false;
        isHitStumbling = false;

        document.getElementById('scoreBadge').textContent = '⭐ 0';
        document.getElementById('livesBadge').textContent = '❤️ 3';
        document.getElementById('victoryArea').classList.add('d-none');
        document.getElementById('retryArea').classList.add('d-none');
        document.getElementById('playArea').classList.remove('d-none');

        generateQuestion();
        animationFrameId = requestAnimationFrame(gameLoop);
    }

    function toggleLanguage() {
        currentLang = (currentLang === 'hi') ? 'en' : 'hi';
        document.getElementById('langBtn').textContent = (currentLang === 'hi') ? "🌐 Switch to English" : "🌐 हिंदी में बदलें";
        if (!isGameOver) {
            const speechQ = (currentLang === 'hi') 
                ? `${currentQuestion.text} कितना होगा?`
                : `What is ${currentQuestion.text}?`;
            speakText(speechQ);
        }
    }

    window.onload = () => {
        loadVoices();
        generateQuestion();
        animationFrameId = requestAnimationFrame(gameLoop);
    };
</script>
