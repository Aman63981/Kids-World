<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon Color Pop - KidsWorld</title>

    <!-- Favicon: Laughing Kid Face -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23FACC15' stroke='%231E293B' stroke-width='2'/%3E%3Cpath d='M19 26c.5-4 6.5-4 7 0M38 26c.5-4 6.5-4 7 0' stroke='%231E293B' stroke-width='3.5' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='16' cy='33' r='4.5' fill='%23FB7185'/%3E%3Ccircle cx='48' cy='33' r='4.5' fill='%23FB7185'/%3E%3Cpath d='M22 34c0 0 1 12 10 12s10-12 10-12Z' fill='%23881337' stroke='%231E293B' stroke-width='2'/%3E%3Cellipse cx='32' cy='44' rx='6' ry='3.5' fill='%23F43F5E'/%3E%3C/svg%3E">

    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Fredoka Kids Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 50%, #fef3c7 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        .game-wrapper {
            width: 95%;
            max-width: 860px;
            background: #ffffff;
            border-radius: 36px;
            padding: 24px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.12);
            border: 6px solid #38bdf8;
            position: relative;
        }

        .badge-pill-custom {
            border-radius: 50px;
            padding: 8px 18px;
            font-weight: 700;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* Sky Play Stage */
        .sky-stage {
            position: relative;
            width: 100%;
            height: 480px;
            background: linear-gradient(180deg, #60a5fa 0%, #93c5fd 50%, #e0f2fe 100%);
            border-radius: 28px;
            overflow: hidden;
            border: 4px dashed #38bdf8;
            margin-top: 15px;
        }

        /* Floating Clouds in Background */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50px;
            pointer-events: none;
            animation: cloudFloat 18s linear infinite;
        }
        @keyframes cloudFloat {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-200px); }
        }

        /* Floating Balloon Node */
        .balloon-node {
            position: absolute;
            width: 76px;
            height: 100px;
            cursor: pointer;
            z-index: 10;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.18));
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.12s;
        }

        .balloon-body {
            width: 76px;
            height: 90px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
            box-shadow: inset -6px -6px 12px rgba(0,0,0,0.15), inset 6px 6px 12px rgba(255,255,255,0.4);
        }

        /* Glossy Highlight Reflection */
        .balloon-body::before {
            content: '';
            position: absolute;
            top: 14px;
            left: 14px;
            width: 14px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.65);
            transform: rotate(-30deg);
        }

        /* Bottom Knot & Thread */
        .balloon-knot {
            width: 10px;
            height: 6px;
            border-radius: 3px;
            margin-top: -2px;
        }

        .balloon-string {
            width: 2px;
            height: 35px;
            background: rgba(255, 255, 255, 0.7);
        }

        /* Rubber Jiggle / Wobble for Wrong Click */
        .wobble {
            animation: rubberWobble 0.5s ease-in-out;
        }
        @keyframes rubberWobble {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.2, 0.8) rotate(-12deg); }
            40% { transform: scale(0.8, 1.2) rotate(10deg); }
            60% { transform: scale(1.1, 0.9) rotate(-6deg); }
            80% { transform: scale(0.95, 1.05) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Particles on Pop */
        .pop-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 20;
            animation: burstFade 0.45s ease-out forwards;
        }
        @keyframes burstFade {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* Action Buttons */
        .kid-btn {
            border-radius: 22px;
            border-bottom: 5px solid rgba(0,0,0,0.18) !important;
            font-weight: 700;
            transition: all 0.15s ease-in-out;
        }
        .kid-btn:active {
            transform: translateY(3px);
            border-bottom: 2px solid rgba(0,0,0,0.18) !important;
        }

        .speaker-bubble {
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 8px 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #b45309;
        }
        .speaker-bubble:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b45309;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- Header Controls -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <a href="../Home page.html" class="btn btn-outline-secondary kid-btn py-2 px-3">
            <i class="bi bi-arrow-left me-1"></i> Dashboard
        </a>
        <button class="btn btn-warning kid-btn px-3 py-2" id="langBtn" onclick="toggleLanguage()">
            🌐 Switch to English
        </button>
        <span class="badge bg-primary badge-pill-custom" id="scoreBadge">
            🎈 0 / 5
        </span>
    </div>

    <!-- Active Stage -->
    <div id="playArea">
        <div class="d-flex justify-content-center align-items-center gap-3 mt-3 text-center">
            <h2 class="fw-bold text-dark m-0" id="questPrompt">सभी लाल गुब्बारे फोड़ें! 🔴</h2>
            <button class="speaker-bubble" onclick="replayQuestVoice()">
                <i class="bi bi-volume-up-fill fs-5"></i>
            </button>
        </div>

        <div class="sky-stage" id="skyStage">
            <!-- Floating Decorative Clouds -->
            <div class="cloud" style="width: 120px; height: 40px; top: 30px; left: 10%;"></div>
            <div class="cloud" style="width: 160px; height: 50px; top: 120px; left: 60%; animation-delay: -6s;"></div>
            <div class="cloud" style="width: 90px; height: 35px; top: 220px; left: 25%; animation-delay: -11s;"></div>

            <!-- Active Balloons Spawner Layer -->
            <div id="balloonsContainer"></div>
        </div>
    </div>

    <!-- Victory Modal / Screen -->
    <div id="victoryArea" class="d-none text-center py-4">
        <div style="font-size: 5rem;">🎈 🏆 ✨ 🎊</div>
        <h1 class="display-5 fw-bolder text-success mb-2" id="winTitle">कमाल का खेल!</h1>
        <p class="fs-4 text-secondary mb-3" id="winSubtitle">आपने सभी सही रंग के गुब्बारे पहचान कर फोड़ दिए!</p>

        <div class="card p-3 my-3 mx-auto shadow-sm rounded-4 border-0 text-center" style="max-width: 360px; background: #fef08a; border: 3px dashed #f59e0b !important;">
            <span class="text-muted fw-bold">TOTAL SCORE</span>
            <h1 class="display-4 fw-bold text-dark my-1" id="finalStarsDisplay">⭐ 500</h1>
            <div class="fs-3 text-warning">⭐⭐⭐⭐⭐</div>
            <span class="badge bg-success rounded-pill px-3 py-2 mt-2 fs-6">बैज: कलर पॉप मास्टर 🎈</span>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
            <button class="btn btn-warning kid-btn px-4 py-3 fs-5" onclick="restartQuest()">
                <i class="bi bi-arrow-clockwise me-1"></i> फिर से खेलें
            </button>
            <a href="../Home page.html" class="btn btn-primary kid-btn text-white px-4 py-3 fs-5 text-decoration-none">
                <i class="bi bi-house-door me-1"></i> डैशबोर्ड
            </a>
        </div>
    </div>
</div>

<script>
    // --- 1. Web Audio Sound Engine (Crisp Pop & Spring Boing) ---
    let audioCtx = null;
    function getAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playPopSound() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);

        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
    }

    function playBoingSound() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(320, now + 0.1);
        osc.frequency.linearRampToValueAtTime(150, now + 0.25);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
    }

    function playFanfareSound() {
        const ctx = getAudioContext();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
            gain.gain.setValueAtTime(0.3, ctx.currentTime + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.12);
            osc.stop(ctx.currentTime + idx * 0.12 + 0.35);
        });
    }

    // --- 2. Voice Guidance Engine ---
    let currentLang = 'hi';
    let availableVoices = [];

    function loadVoices() {
        if ('speechSynthesis' in window) {
            availableVoices = window.speechSynthesis.getVoices();
        }
    }
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 0.9;
        utter.pitch = 1.3;

        if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();

        if (currentLang === 'hi') {
            utter.lang = 'hi-IN';
            const v = availableVoices.find(item => item.lang.includes('hi'));
            if (v) utter.voice = v;
        } else {
            utter.lang = 'en-US';
            const v = availableVoices.find(item => item.lang.includes('en') && (item.name.includes('Samantha') || item.name.includes('Zira') || item.name.includes('Female')));
            if (v) utter.voice = v;
        }
        window.speechSynthesis.speak(utter);
    }

    // --- 3. Color Dataset ---
    const colorDataset = [
        { id: 'red', nameHi: 'लाल', nameEn: 'Red', hex: '#EF4444', emoji: '🔴' },
        { id: 'blue', nameHi: 'नीला', nameEn: 'Blue', hex: '#3B82F6', emoji: '🔵' },
        { id: 'yellow', nameHi: 'पीला', nameEn: 'Yellow', hex: '#EAB308', emoji: '🟡' },
        { id: 'green', nameHi: 'हरा', nameEn: 'Green', hex: '#22C55E', emoji: '🟢' },
        { id: 'purple', nameHi: 'बैंगनी', nameEn: 'Purple', hex: '#A855F7', emoji: '🟣' }
    ];

    let currentQuestColor = null;
    let targetPopsNeeded = 5;
    let poppedCount = 0;
    let totalScore = 0;
    let spawnTimer = null;
    let activeBalloons = [];

    // --- 4. Game Setup & Spawning Engine ---
    function initRound() {
        poppedCount = 0;
        clearAllBalloons();

        // Randomly choose target color
        currentQuestColor = colorDataset[Math.floor(Math.random() * colorDataset.length)];
        updateQuestBanner();
        updateScoreBadge();

        setTimeout(() => replayQuestVoice(), 400);

        // Start floating spawner
        if (spawnTimer) clearInterval(spawnTimer);
        spawnTimer = setInterval(spawnBalloon, 1100);
    }

    function spawnBalloon() {
        const stage = document.getElementById('skyStage');
        if (!stage) return;

        // 60% chance to spawn target color, 40% decoy
        const isTarget = Math.random() < 0.6;
        let balloonColor = currentQuestColor;

        if (!isTarget) {
            const others = colorDataset.filter(c => c.id !== currentQuestColor.id);
            balloonColor = others[Math.floor(Math.random() * others.length)];
        }

        const balloon = document.createElement('div');
        balloon.className = 'balloon-node';
        
        // Random horizontal start (10% to 85%)
        const leftPercent = Math.floor(Math.random() * 75) + 10;
        balloon.style.left = `${leftPercent}%`;
        balloon.style.bottom = '-110px';

        balloon.innerHTML = `
            <div class="balloon-body" style="background-color: ${balloonColor.hex};"></div>
            <div class="balloon-knot" style="background-color: ${balloonColor.hex};"></div>
            <div class="balloon-string"></div>
        `;

        // Click / Tap Handler
        balloon.onclick = (e) => onBalloonClick(balloon, balloonColor, e);

        stage.appendChild(balloon);

        // Smooth float animation
        let bottomPos = -110;
        const speed = Math.random() * 1.2 + 1.8; // Floating speed
        const wobbleFactor = Math.random() * 0.05 + 0.02;
        let angle = 0;

        const floatInterval = setInterval(() => {
            bottomPos += speed;
            angle += wobbleFactor;
            balloon.style.bottom = `${bottomPos}px`;
            balloon.style.transform = `translateX(${Math.sin(angle) * 15}px)`;

            // Remove when flies out of top
            if (bottomPos > 500) {
                clearInterval(floatInterval);
                balloon.remove();
            }
        }, 20);

        balloon.dataset.floatId = floatInterval;
    }

    function onBalloonClick(balloonEl, balloonColor, event) {
        getAudioContext();

        if (balloonColor.id === currentQuestColor.id) {
            // Correct Balloon Pop
            clearInterval(balloonEl.dataset.floatId);
            playPopSound();
            createBurstParticles(balloonEl, balloonColor.hex);

            balloonEl.remove();
            poppedCount++;
            updateScoreBadge();

            // Speak progress count
            speakText(`${poppedCount}`);

            if (poppedCount >= targetPopsNeeded) {
                clearInterval(spawnTimer);
                clearAllBalloons();
                totalScore += 100;

                setTimeout(() => {
                    showVictory();
                }, 600);
            }

        } else {
            // Wrong Balloon Tap: Rubber Jiggle & Boing
            playBoingSound();
            balloonEl.classList.remove('wobble');
            void balloonEl.offsetWidth; // Force Reflow
            balloonEl.classList.add('wobble');

            const oopsText = (currentLang === 'hi') 
                ? `यह ${balloonColor.nameHi} है! ${currentQuestColor.nameHi} फोड़ो!` 
                : `That's ${balloonColor.nameEn}! Pop ${currentQuestColor.nameEn}!`;
            speakText(oopsText);
        }
    }

    // Particle Burst Explosion
    function createBurstParticles(balloonEl, hexColor) {
        const stage = document.getElementById('skyStage');
        const rect = balloonEl.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();

        const centerX = rect.left - stageRect.left + 38;
        const centerY = rect.top - stageRect.top + 45;

        for (let i = 0; i < 12; i++) {
            const particle = document.createElement('div');
            particle.className = 'pop-particle';
            particle.style.backgroundColor = hexColor;
            particle.style.width = `${Math.random() * 8 + 6}px`;
            particle.style.height = particle.style.width;
            particle.style.left = `${centerX}px`;
            particle.style.top = `${centerY}px`;

            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 60 + 30;
            particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
            particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);

            stage.appendChild(particle);
            setTimeout(() => particle.remove(), 450);
        }
    }

    function clearAllBalloons() {
        const stage = document.getElementById('skyStage');
        const balloons = stage.querySelectorAll('.balloon-node');
        balloons.forEach(b => {
            clearInterval(b.dataset.floatId);
            b.remove();
        });
    }

    function updateScoreBadge() {
        document.getElementById('scoreBadge').textContent = `🎈 ${poppedCount} / ${targetPopsNeeded}`;
    }

    function updateQuestBanner() {
        const promptEl = document.getElementById('questPrompt');
        if (currentLang === 'hi') {
            promptEl.innerHTML = `सभी <span style="color:${currentQuestColor.hex}; font-weight:800;">${currentQuestColor.nameHi}</span> गुब्बारे फोड़ें! ${currentQuestColor.emoji}`;
            document.getElementById('langBtn').textContent = "🌐 Switch to English";
        } else {
            promptEl.innerHTML = `Pop all <span style="color:${currentQuestColor.hex}; font-weight:800;">${currentQuestColor.nameEn}</span> balloons! ${currentQuestColor.emoji}`;
            document.getElementById('langBtn').textContent = "🌐 हिंदी में बदलें";
        }
    }

    function replayQuestVoice() {
        const questText = (currentLang === 'hi') 
            ? `सभी ${currentQuestColor.nameHi} गुब्बारे फोड़ो!` 
            : `Pop all the ${currentQuestColor.nameEn} balloons!`;
        speakText(questText);
    }

    function toggleLanguage() {
        currentLang = (currentLang === 'hi') ? 'en' : 'hi';
        updateQuestBanner();
        replayQuestVoice();
    }

    function showVictory() {
        document.getElementById('playArea').classList.add('d-none');
        document.getElementById('victoryArea').classList.remove('d-none');

        if (currentLang === 'hi') {
            document.getElementById('winTitle').textContent = "कमाल का खेल!";
            document.getElementById('winSubtitle').textContent = "आपने सभी सही रंग के गुब्बारे पहचान कर फोड़ दिए!";
        } else {
            document.getElementById('winTitle').textContent = "Awesome Job!";
            document.getElementById('winSubtitle').textContent = "You recognized and popped all target balloons!";
        }

        playFanfareSound();
        confetti({ particleCount: 140, spread: 80, origin: { y: 0.55 } });

        setTimeout(() => {
            const cheer = (currentLang === 'hi') 
                ? "शाबाश! आपने गुब्बारा चैलेंज जीत लिया!" 
                : "Hooray! You won the Balloon Pop Challenge!";
            speakText(cheer);
        }, 500);
    }

    function restartQuest() {
        document.getElementById('victoryArea').classList.add('d-none');
        document.getElementById('playArea').classList.remove('d-none');
        initRound();
    }

    window.onload = () => {
        loadVoices();
        initRound();
    };
</script>
</body>
</html>
