<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Sound Peek-a-Boo - PlayLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script src="./screen-guard.js"></script>
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(180deg, #bbf7d0 0%, #86efac 50%, #fef08a 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        .game-board {
            width: 95%;
            max-width: 820px;
            background: #ffffff;
            border-radius: 35px;
            padding: 25px;
            box-shadow: 0 16px 35px rgba(0,0,0,0.12);
            position: relative;
            border: 6px solid #4ade80;
            overflow: hidden;
        }

        .jungle-arena {
            background: linear-gradient(180deg, #dcfce7 0%, #bbf7d0 100%);
            border-radius: 28px;
            padding: 25px 15px;
            border: 4px dashed #86efac;
            position: relative;
            min-height: 360px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* Full Animal Pod (Button + Animal Image above) */
        .animal-pod {
            width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }
        .animal-pod:hover {
            transform: scale(1.05);
        }
        .animal-pod:active {
            transform: scale(0.96);
        }

        /* Large Animal PNG standing proud on the button */
        .animal-img-box {
            width: 135px;
            height: 135px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: -18px; /* Slightly overlaps the button base */
            z-index: 10;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .animal-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Win celebration bounce */
        .animal-pod.winner .animal-img-box {
            transform: scale(1.25) translateY(-15px);
            filter: drop-shadow(0 12px 18px rgba(34, 197, 94, 0.45));
        }

        /* Chunky Leafy Button Base */
        .bush-button {
            width: 180px;
            background: #22c55e;
            border-radius: 28px;
            padding: 15px 10px 12px 10px;
            border-bottom: 7px solid #15803d;
            box-shadow: 0 8px 0 rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            transition: all 0.15s;
        }
        .animal-pod:active .bush-button {
            transform: translateY(4px);
            border-bottom: 3px solid #15803d;
        }

        .animal-label {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Error Shake Animation */
        .shake-pod {
            animation: podShake 0.4s ease-in-out;
        }
        @keyframes podShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-12px); }
            75% { transform: translateX(12px); }
        }

        .kid-btn {
            border-radius: 20px;
            border-bottom: 5px solid rgba(0,0,0,0.18) !important;
            font-weight: 700;
            transition: all 0.15s ease-in-out;
        }
        .kid-btn:active {
            transform: translateY(3px);
            border-bottom: 2px solid rgba(0,0,0,0.18) !important;
        }

        .sound-wave-btn {
            background: #f59e0b;
            color: #ffffff;
            border-radius: 50px;
            padding: 10px 22px;
            font-size: 1.15rem;
            font-weight: 700;
            box-shadow: 0 6px 0 #b45309;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }
        .sound-wave-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #b45309;
        }
    </style>
</head>
<body>

<div class="game-board" id="gameBoard">
    <!-- Top Progress Bar -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="badge bg-warning text-dark fs-5 px-3 py-2 rounded-pill">Progress: <span id="progressText">1/5</span></span>
        <button class="sound-wave-btn d-flex align-items-center gap-2" onclick="replayTargetSound()">
            <i class="bi bi-volume-up-fill fs-4"></i>
            <span>Hear Sound!</span>
        </button>
        <span class="badge bg-success fs-5 px-3 py-2 rounded-pill" id="scoreBadge">⭐ 0</span>
    </div>

    <!-- Active Arena -->
    <div id="playSection">
        <div class="text-center mb-3">
            <h3 id="feedbackPrompt" class="fw-bold text-primary">Listen! Which animal makes this sound? 🐾</h3>
        </div>

        <div class="jungle-arena">
            <!-- Animal 0 -->
            <div class="animal-pod" id="pod0" onclick="selectAnimal(0)">
                <div class="animal-img-box">
                    <img id="img0" src="" alt="Animal 0">
                </div>
                <div class="bush-button">
                    <span class="animal-label" id="name0">Dog</span>
                </div>
            </div>

            <!-- Animal 1 -->
            <div class="animal-pod" id="pod1" onclick="selectAnimal(1)">
                <div class="animal-img-box">
                    <img id="img1" src="" alt="Animal 1">
                </div>
                <div class="bush-button">
                    <span class="animal-label" id="name1">Cat</span>
                </div>
            </div>

            <!-- Animal 2 -->
            <div class="animal-pod" id="pod2" onclick="selectAnimal(2)">
                <div class="animal-img-box">
                    <img id="img2" src="" alt="Animal 2">
                </div>
                <div class="bush-button">
                    <span class="animal-label" id="name2">Cow</span>
                </div>
            </div>
        </div>

        <div class="text-center mt-3">
            <span class="text-secondary fw-bold fs-6">👉 Listen to the sound and tap the matching animal!</span>
        </div>
    </div>

    <!-- Victory Screen -->
    <div id="victorySection" class="d-none text-center py-4">
        <div style="font-size: 5rem;">🎉</div>
        <h1 class="display-5 fw-bolder text-success mb-2">Animal Sound Expert!</h1>
        <p class="fs-4 text-secondary mb-3">You matched all the real animal sounds!</p>

        <div class="card p-3 my-3 mx-auto shadow-sm rounded-4 border-0 text-center" style="max-width: 380px; background: #fef08a; border: 3px dashed #f59e0b !important;">
            <span class="text-muted fw-bold">TOTAL SCORE</span>
            <h1 class="display-4 fw-bold text-dark my-1" id="finalScoreDisplay">500 / 500</h1>
            <div class="fs-3 text-warning my-1" id="starsContainer">⭐⭐⭐⭐⭐</div>
            <span class="badge bg-success rounded-pill px-3 py-2 mt-2 fs-6" id="badgeTitle">Badge: Jungle Master</span>
        </div>

        <div class="d-flex flex-wrap justify-content-center gap-3 mt-4">
            <button class="btn btn-warning kid-btn text-dark px-4 py-3 fs-5" onclick="restartGame()">
                <i class="bi bi-arrow-clockwise me-1"></i> Play Again
            </button>
            <button class="btn btn-primary kid-btn text-white px-4 py-3 fs-5" onclick="goToMenu()">
                <i class="bi bi-house-door me-1"></i> Dashboard
            </button>
        </div>
    </div>
</div>

<script>
    // --- 1. Sound FX & Unblocking Audio Engine ---
    let audioCtx = null;
    function getAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    const unlockAudio = () => {
        getAudioContext();
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
    };
    window.addEventListener('click', unlockAudio);
    window.addEventListener('touchstart', unlockAudio);

    function playPopFX() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(950, now + 0.1);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
    }

    function playWrongFX() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.linearRampToValueAtTime(120, now + 0.25);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
    }

    function speakWord(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.rate = 0.95;
            utter.pitch = 1.3;
            window.speechSynthesis.speak(utter);
        }
    }

    const kidsCheerAudio = new Audio('kids_cheering.mp3');
    kidsCheerAudio.preload = 'auto';

    function playCrowdCheerSound() {
        kidsCheerAudio.volume = 0.8;
        kidsCheerAudio.currentTime = 0;
        kidsCheerAudio.play().catch(err => console.log("Audio waiting:", err));
    }

    // --- 2. Reliable Direct Audio & Clean PNG Database ---
    const allAnimals = [
        {
            name: 'Dog',
            image: 'https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f436.png',
            soundUrl: 'https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3?filename=dog-barking-70808.mp3'
        },
        {
            name: 'Cat',
            image: 'https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f431.png',
            soundUrl: 'https://cdn.pixabay.com/download/audio/2022/03/24/audio_3341b53e82.mp3?filename=meow-101111.mp3'
        },
        {
            name: 'Cow',
            image: 'https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f42e.png',
            soundUrl: 'https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=cow-moo-105898.mp3'
        },
        {
            name: 'Lion',
            image: 'https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f981.png',
            soundUrl: 'https://cdn.pixabay.com/download/audio/2022/03/10/audio_b281f6236b.mp3?filename=lion-roar-6011.mp3'
        },
        {
            name: 'Duck',
            image: 'https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f986.png',
            soundUrl: 'https://cdn.pixabay.com/download/audio/2022/03/24/audio_03d927a4e0.mp3?filename=duck-quack-112941.mp3'
        },
        {
            name: 'Frog',
            image: 'https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f438.png',
            soundUrl: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_228f416183.mp3?filename=frog-croak-102552.mp3'
        },
        {
            name: 'Sheep',
            image: 'https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f411.png',
            soundUrl: 'https://cdn.pixabay.com/download/audio/2021/08/04/audio_bb630aa074.mp3?filename=sheep-122256.mp3'
        }
    ];

    const currentAnimalAudio = new Audio();
    currentAnimalAudio.preload = 'auto';

    function playAnimalSound(url) {
        currentAnimalAudio.pause();
        currentAnimalAudio.src = url;
        currentAnimalAudio.currentTime = 0;
        currentAnimalAudio.play().catch(e => {
            console.log("Audio waiting for user gesture:", e);
        });
    }

    const TOTAL_ROUNDS = 5;
    let currentRound = 0;
    let score = 0;
    let isRoundLocked = false;

    let targetAnimal = null;
    let correctSlotIndex = 0;
    let currentSlots = [null, null, null];

    const feedbackPrompt = document.getElementById('feedbackPrompt');
    const progressText = document.getElementById('progressText');
    const scoreBadge = document.getElementById('scoreBadge');
    const playSection = document.getElementById('playSection');
    const victorySection = document.getElementById('victorySection');
    const finalScoreDisplay = document.getElementById('finalScoreDisplay');

    // --- 3. Round Setup ---
    function loadRound(roundIdx) {
        isRoundLocked = false;
        progressText.textContent = `${roundIdx + 1}/${TOTAL_ROUNDS}`;

        for (let i = 0; i < 3; i++) {
            const pod = document.getElementById(`pod${i}`);
            pod.classList.remove('winner', 'shake-pod');
        }

        const shuffled = [...allAnimals].sort(() => 0.5 - Math.random());
        currentSlots = [shuffled[0], shuffled[1], shuffled[2]];
        correctSlotIndex = Math.floor(Math.random() * 3);
        targetAnimal = currentSlots[correctSlotIndex];

        // Populate PNGs & Names above the buttons
        for (let i = 0; i < 3; i++) {
            document.getElementById(`img${i}`).src = currentSlots[i].image;
            document.getElementById(`name${i}`).textContent = currentSlots[i].name;
        }

        feedbackPrompt.textContent = "Listen! Which animal makes this sound? 🐾";
        feedbackPrompt.className = "fw-bold text-primary fs-4";

        setTimeout(() => {
            playAnimalSound(targetAnimal.soundUrl);
        }, 400);
    }

    function replayTargetSound() {
        if (isRoundLocked || !targetAnimal) return;
        getAudioContext();
        playAnimalSound(targetAnimal.soundUrl);
    }

    // --- 4. User Interaction ---
    function selectAnimal(index) {
        if (isRoundLocked) return;
        getAudioContext();

        const podEl = document.getElementById(`pod${index}`);

        if (index === correctSlotIndex) {
            isRoundLocked = true;
            playPopFX();
            podEl.classList.add('winner');

            score += 100;
            scoreBadge.textContent = `⭐ ${score}`;

            feedbackPrompt.textContent = `Yes! That's the ${targetAnimal.name}! 🎉`;
            feedbackPrompt.className = "fw-bold text-success fs-3";

            setTimeout(() => {
                speakWord(`Great job! That is the ${targetAnimal.name}!`);
            }, 100);

            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });

            setTimeout(() => {
                currentRound++;
                if (currentRound < TOTAL_ROUNDS) {
                    loadRound(currentRound);
                } else {
                    showVictoryScreen();
                }
            }, 1900);

        } else {
            playWrongFX();
            podEl.classList.add('shake-pod');
            setTimeout(() => podEl.classList.remove('shake-pod'), 400);

            feedbackPrompt.textContent = `Not this one! Listen again! 😊`;
            feedbackPrompt.className = "fw-bold text-danger fs-5";

            score = Math.max(0, score - 20);
            scoreBadge.textContent = `⭐ ${score}`;

            setTimeout(() => {
                playAnimalSound(targetAnimal.soundUrl);
            }, 350);
        }
    }

    // --- 5. Victory Screen ---
    function showVictoryScreen() {
        playSection.classList.add('d-none');
        victorySection.classList.remove('d-none');
        finalScoreDisplay.textContent = `${score} / ${TOTAL_ROUNDS * 100}`;

        const starsContainer = document.getElementById('starsContainer');
        const badgeTitle = document.getElementById('badgeTitle');

        let starCount = 1;
        let badgeName = "Keep Exploring! 🌿";

        if (score >= 450) {
            starCount = 5;
            badgeName = "Badge Unlocked: Jungle Master 🦁";
        } else if (score >= 350) {
            starCount = 4;
            badgeName = "Badge Unlocked: Sound Detective 👂";
        } else if (score >= 250) {
            starCount = 3;
            badgeName = "Badge Unlocked: Animal Explorer 🐾";
        } else {
            starCount = 2;
            badgeName = "Badge Unlocked: Nature Friend 🐣";
        }

        starsContainer.innerHTML = '⭐'.repeat(starCount) + '<span style="opacity: 0.25;">' + '⭐'.repeat(5 - starCount) + '</span>';
        badgeTitle.textContent = badgeName;

        playCrowdCheerSound();
        setTimeout(() => speakWord("Hooray! You identified all the animal sounds!"), 500);

        confetti({
            particleCount: 160,
            spread: 90,
            origin: { y: 0.5 }
        });
    }

    function restartGame() {
        currentRound = 0;
        score = 0;
        scoreBadge.textContent = '⭐ 0';
        victorySection.classList.add('d-none');
        playSection.classList.remove('d-none');
        loadRound(0);
    }

    function goToMenu() {
        alert("Returning to PlayLearn Platform!");
    }

    loadRound(0);
</script>
</body>
</html>
